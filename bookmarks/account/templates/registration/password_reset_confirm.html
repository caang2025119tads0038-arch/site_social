{% extends "base.html" %}

{% block title %}Reset your password{% endblock %}

{% block content %}

<h1>Mudar Senha</h1>

{% if validlink %}
<p>Digite sua nova senha duas vezes:</p>
<form method="post">
    {{ form.as_p }}
    {% csrf_token %}
    <p><input type="submit" value="Mudar senha" /></p>
</form>
{% else %}
<p>O link de recuperação é inválido.</p>

{% endif %}

{% endblock %}
