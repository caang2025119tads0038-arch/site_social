{% extends "base.html" %}

{% block title %}Change your password{% endblock %}
{% block content %}

<h1>Alterar Senha</h1>
<p>Use o formulário abaixo para mudar sua senha.</p>
<form method="post">
    {{ form.as_p }}
    <p><input type="submit" value="Salvar"></p>
    {% csrf_token %}
</form>
{% endblock %}
