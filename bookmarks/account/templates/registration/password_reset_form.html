{% extends "base.html" %}

{% block title %}Recuperar Senha{% endblock %}

{% block content %}

<h1>Esqueceu sua senha?</h1>
<p>Informe seu e-mail para criar uma nova:</p>
<form method="post">
    {{ form.as_p }}
    <p><input type="submit" value="Enviar e-mail"></p>
    {% csrf_token %}
</form>
{% endblock %}
